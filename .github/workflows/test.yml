name: Test

# Nothing here needs an engine, a window or a display: both games compile with
# GK_NO_MAIN against the stub, so CI runs the real game loops headless. The last
# steps build the core as wasm32 and gate its size.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4

      - name: Build the demo game's suite
        run: cc -std=c11 -O2 -Wall -Wextra -Wno-unused-function -DGK_NO_MAIN -I. -Istub -o gk-tests main.c stub/raylib_stub.c tests/test_gk.c -lm

      - name: Run the demo game's suite
        run: ./gk-tests

      - name: Build the snake suite
        run: cc -std=c11 -O2 -Wall -Wextra -Wno-unused-function -DGK_NO_MAIN -I. -Istub -DSNAKE_HEADLESS -o snake-tests examples/snake.c stub/raylib_stub.c tests/test_snake.c -lm

      - name: Run the snake suite
        run: ./snake-tests

      - name: Install a C compiler that targets wasm32
        run: pip install ziglang

      - name: Build the core as wasm32
        run: |
          ZIG=$(python3 -c "import ziglang,os;print(os.path.join(os.path.dirname(ziglang.__file__),'zig'))")
          "$ZIG" cc -target wasm32-wasi-musl -std=c11 -Os -DGK_NO_MAIN -I. -Istub \
            -Wl,--no-entry -Wl,--export=gk_smoke -o gk-core.wasm web/wasm_smoke.c -lm
          wc -c < gk-core.wasm

      # The integration check: the real main() of both games, linked against the
      # stub, run for a fixed number of frames. Proves the loop, the scene
      # machine and the render path execute - not that raylib draws.
      - name: Run both games headless for 120 frames
        run: |
          cc -std=c11 -O2 -Wno-unused-function -I. -Istub -o gk-linkcheck main.c stub/raylib_stub.c -lm
          cc -std=c11 -O2 -Wno-unused-function -I. -Istub -o snake-linkcheck examples/snake.c stub/raylib_stub.c -lm
          for game in gk snake; do
            out=$(GK_FRAMES=120 ./$game-linkcheck)
            printf '%-6s %s\n' "$game" "$out"
            case "$out" in
              frames=120" "draws=0) printf 'FAIL: %s drew nothing\n' "$game"; exit 1 ;;
              frames=120" "draws=*) : ;;
              *) printf 'FAIL: %s did not run 120 frames\n' "$game"; exit 1 ;;
            esac
          done
          printf 'OK: both games ran 120 frames headless\n'

      - name: Cross-compile the core for other machines
        run: |
          ZIG=$(python3 -c "import ziglang,os;print(os.path.join(os.path.dirname(ziglang.__file__),'zig'))")
          for t in aarch64-linux-musl arm-linux-musleabihf riscv64-linux-musl x86_64-windows-gnu aarch64-macos; do
            printf '%-24s ' "$t"
            if "$ZIG" cc -target "$t" -std=c11 -O2 -DGK_NO_MAIN -I. -Istub -c web/wasm_smoke.c -o "/tmp/gk-$t.o"; then
              printf 'OK  %s bytes\n' "$(wc -c < "/tmp/gk-$t.o")"
            else
              printf 'FAIL\n'; exit 1
            fi
          done

      # The core was 1,351 bytes when this gate was written. 64 KB is far above
      # that and far below the 10 MB ceiling: it catches a libc accidentally
      # retained or a dependency creeping in, not ordinary growth.
      - name: Gate the wasm size
        run: |
          bytes=$(wc -c < gk-core.wasm | tr -d ' ')
          printf 'wasm core is %s bytes\n' "$bytes"
          if [ "$bytes" -gt 65536 ]; then
            printf 'FAIL: over the 64 KB wasm gate\n'
            exit 1
          fi
          printf 'OK: under the 64 KB wasm gate\n'
