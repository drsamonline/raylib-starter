name: Test

# Nothing here needs an engine, a window or a display: both games compile with
# GK_NO_MAIN against the stub, so CI runs the real game loops headless. The last
# steps build the core as wasm32 and gate its size.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4

      - name: Build the demo game's suite
        run: cc -std=c11 -O2 -Wall -Wextra -DGK_NO_MAIN -I. -Istub -o gk-tests main.c stub/raylib_stub.c tests/test_gk.c -lm

      - name: Run the demo game's suite
        run: ./gk-tests

      - name: Build the snake suite
        run: cc -std=c11 -O2 -Wall -Wextra -DGK_NO_MAIN -I. -Istub -DSNAKE_HEADLESS -o snake-tests examples/snake.c stub/raylib_stub.c tests/test_snake.c -lm

      - name: Run the snake suite
        run: ./snake-tests

      - name: Build the audio suite
        run: cc -std=c11 -O2 -Wall -Wextra -Werror -I. -Istub -o audio-tests tests/test_audio.c stub/raylib_stub.c -lm

      - name: Run the audio suite
        run: ./audio-tests

      # A README number is a claim. This rebuilds the three suites and fails when
      # one of them disagrees with what the README states.
      - name: Check the README's claims
        run: sh tools/check-claims.sh

      - name: Install a C compiler that targets wasm32
        run: pip install ziglang

      - name: Build the core as wasm32
        run: |
          ZIG=$(python3 -c "import ziglang,os;print(os.path.join(os.path.dirname(ziglang.__file__),'zig'))")
          "$ZIG" cc -target wasm32-wasi-musl -std=c11 -Os -DGK_NO_MAIN -I. -Istub \
            -Wl,--no-entry -Wl,--export=gk_smoke -o gk-core.wasm web/wasm_smoke.c -lm
          wc -c < gk-core.wasm

      # The integration check: the real main() of both games, linked against the
      # stub, run for a fixed number of frames. Proves the loop, the scene
      # machine and the render path execute - not that raylib draws.
      - name: Run both games headless for 120 frames
        run: |
          cc -std=c11 -O2 -I. -Istub -o gk-linkcheck main.c stub/raylib_stub.c -lm
          cc -std=c11 -O2 -I. -Istub -o snake-linkcheck examples/snake.c stub/raylib_stub.c -lm
          for game in gk snake; do
            out=$(GK_AUTOPLAY=1 GK_FRAMES=120 ./$game-linkcheck)
            frames=$(printf '%s' "$out" | sed -n 's/.*frames=\([0-9]*\).*/\1/p')
            draws=$(printf '%s' "$out" | sed -n 's/.*draws=\([0-9]*\).*/\1/p')
            printf '%-6s frames=%s draws=%s\n' "$game" "$frames" "$draws"
            [ "$frames" = "120" ] || { printf 'FAIL: %s ran %s frames\n' "$game" "$frames"; exit 1; }
            [ "$draws" -gt 500 ] || { printf 'FAIL: %s drew only %s - the play scene never ran\n' "$game" "$draws"; exit 1; }
          done
          printf 'OK: both games ran 120 frames headless, past the title\n'

      # The real link: the game against raylib 6.2's own static library, then the
      # 10 MB gate on the actual binary. The weak X11 stubs let it link on a
      # runner with no X server; on one with X11 the real symbols win.
      - name: Link against real raylib and gate the size
        run: |
          curl -sL -o raylib.tar.gz \
            https://github.com/raysan5/raylib/releases/download/6.2/raylib-6.2_linux_amd64.tar.gz
          tar xzf raylib.tar.gz
          cc -std=c11 -O2 -Iraylib-6.2_linux_amd64/include -o gk-real \
            main.c tools/x11_stubs.c raylib-6.2_linux_amd64/lib/libraylib.a \
            -lm -lpthread -ldl -lrt
          strip gk-real || true
          bytes=$(wc -c < gk-real | tr -d ' ')
          printf 'real binary: %s bytes (%s KB)\n' "$bytes" "$((bytes / 1024))"
          if [ "$bytes" -gt 10485760 ]; then
            printf 'FAIL: over the 10 MB ceiling\n'
            exit 1
          fi
          printf 'OK: under the 10 MB ceiling, %sx headroom\n' "$((10485760 / bytes))"

      - name: Cross-compile the core for other machines
        run: |
          ZIG=$(python3 -c "import ziglang,os;print(os.path.join(os.path.dirname(ziglang.__file__),'zig'))")
          for t in aarch64-linux-musl arm-linux-musleabihf riscv64-linux-musl x86_64-windows-gnu aarch64-macos; do
            printf '%-24s ' "$t"
            if "$ZIG" cc -target "$t" -std=c11 -O2 -DGK_NO_MAIN -I. -Istub -c web/wasm_smoke.c -o "/tmp/gk-$t.o"; then
              printf 'OK  %s bytes\n' "$(wc -c < "/tmp/gk-$t.o")"
            else
              printf 'FAIL\n'; exit 1
            fi
          done

      # The core was 1,351 bytes when this gate was written. 64 KB is far above
      # that and far below the 10 MB ceiling: it catches a libc accidentally
      # retained or a dependency creeping in, not ordinary growth.
      - name: Gate the wasm size
        run: |
          bytes=$(wc -c < gk-core.wasm | tr -d ' ')
          printf 'wasm core is %s bytes\n' "$bytes"
          if [ "$bytes" -gt 65536 ]; then
            printf 'FAIL: over the 64 KB wasm gate\n'
            exit 1
          fi
          printf 'OK: under the 64 KB wasm gate\n'
